<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Projetos — Paper Spines</title>
    <style>
      :root {
        --shelf: #26352d;
        --paper: #f6f0dc;
        --ink: #26352d;
        --sun: #f0bd48;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--shelf);
        font-family: Arial, sans-serif;
      }
      .library {
        min-height: 100vh;
        padding: clamp(1rem, 3vw, 3rem);
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 1rem;
      }
      .bar {
        display: flex;
        justify-content: space-between;
        color: var(--paper);
        font:
          700 0.6rem/1 ui-monospace,
          monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .bar b {
        color: var(--sun);
      }
      .books {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.7rem;
        min-height: 0;
      }
      .book {
        position: relative;
        display: flex;
        min-height: 75vh;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 0;
        background: var(--tone);
        color: var(--ink);
        cursor: pointer;
      }
      .book::before {
        position: absolute;
        inset: 0.7rem;
        border: 1px solid rgb(38 53 45/0.45);
        content: '';
      }
      .book span {
        position: relative;
        z-index: 1;
        font:
          700 0.62rem/1 ui-monospace,
          monospace;
        letter-spacing: 0.1em;
        writing-mode: vertical-rl;
      }
      .book h2 {
        position: relative;
        z-index: 1;
        margin: 0;
        font:
          400 clamp(3rem, 7vw, 7rem)/0.72 Georgia,
          serif;
        letter-spacing: -0.1em;
        writing-mode: vertical-rl;
      }
      .book[aria-pressed='true'] {
        box-shadow: 0 0 0 5px var(--paper);
      }
      .page {
        position: fixed;
        z-index: 5;
        inset: clamp(1rem, 3vw, 3rem);
        display: grid;
        grid-template-columns: 1fr 0.8fr;
        gap: 2rem;
        padding: clamp(1.5rem, 5vw, 5rem);
        background: var(--paper);
        color: var(--ink);
        opacity: 0;
        pointer-events: none;
      }
      .page__type {
        color: #a35b2e;
        font:
          700 0.6rem/1 ui-monospace,
          monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .page h1 {
        max-width: 6ch;
        margin: 1rem 0;
        font:
          400 clamp(4rem, 9vw, 9rem)/0.7 Georgia,
          serif;
        letter-spacing: -0.1em;
      }
      .page p {
        max-width: 32rem;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      .page aside {
        display: grid;
        align-content: end;
        border-left: 1px solid #26352d33;
        padding-left: 1.2rem;
      }
      .page button {
        align-self: end;
        border: 1px solid var(--ink);
        background: transparent;
        padding: 0.7rem;
        color: var(--ink);
        font:
          700 0.58rem/1 ui-monospace,
          monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
      }
      @media (max-width: 650px) {
        .books {
          grid-template-columns: repeat(2, 1fr);
        }
        .book {
          min-height: 42vh;
        }
        .page {
          grid-template-columns: 1fr;
          overflow: auto;
        }
        .page aside {
          border-top: 1px solid #26352d33;
          border-left: 0;
          padding: 1rem 0 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="library">
      <header class="bar">
        <span>Estante de projetos</span><b>puxe uma lombada</b><span>4 volumes</span>
      </header>
      <section class="books">
        <button
          class="book"
          style="--tone: #bcd9ee"
          aria-pressed="false"
          data-name="Regula"
          data-type="Volume 01 / produto"
          data-copy="Um sistema de controle para processos de regulação, criado para que as decisões mantenham seu contexto."
        >
          <span>01 / 2026</span>
          <h2>Regula</h2></button
        ><button
          class="book"
          style="--tone: #f1c292"
          aria-pressed="false"
          data-name="eFood"
          data-type="Volume 02 / comércio"
          data-copy="Uma experiência de pedido que aproxima catálogo, decisão e acompanhamento."
        >
          <span>02 / 2025</span>
          <h2>eFood</h2></button
        ><button
          class="book"
          style="--tone: #cddd70"
          aria-pressed="false"
          data-name="E‑Play"
          data-type="Volume 03 / cultura"
          data-copy="Um catálogo de jogos que transforma a descoberta em parte central da sessão."
        >
          <span>03 / 2025</span>
          <h2>E‑Play</h2></button
        ><button
          class="book"
          style="--tone: #d9c4e6"
          aria-pressed="false"
          data-name="To‑Do"
          data-type="Volume 04 / rotina"
          data-copy="Uma ferramenta de tarefas onde organização se torna uma experiência leve e contínua."
        >
          <span>04 / 2024</span>
          <h2>To‑Do</h2>
        </button>
      </section>
    </main>
    <aside class="page">
      <div>
        <span class="page__type"></span>
        <h1></h1>
        <p></p>
      </div>
      <aside><button>Devolver à estante</button></aside>
    </aside>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      const books = [...document.querySelectorAll('.book')],
        page = document.querySelector('.page'),
        type = document.querySelector('.page__type'),
        title = document.querySelector('.page h1'),
        copy = document.querySelector('.page p'),
        close = document.querySelector('.page button'),
        r = matchMedia('(prefers-reduced-motion:reduce)').matches;
      gsap.from(['.bar', '.book'], {
        autoAlpha: 0,
        y: 25,
        stagger: 0.09,
        duration: r ? 0 : 0.7,
        ease: 'power3.out'
      });
      books.forEach(
        (b) =>
          (b.onclick = () => {
            books.forEach((x) => x.setAttribute('aria-pressed', 'false'));
            b.setAttribute('aria-pressed', 'true');
            type.textContent = b.dataset.type;
            title.textContent = b.dataset.name;
            copy.textContent = b.dataset.copy;
            gsap
              .timeline({ defaults: { duration: r ? 0 : 0.5, ease: 'power3.inOut' } })
              .set(page, { pointerEvents: 'auto' })
              .to(page, { autoAlpha: 1 })
              .from('.page > *', { autoAlpha: 0, x: 20, stagger: 0.1 }, '<.1');
          })
      );
      close.onclick = () => {
        gsap.to(page, {
          autoAlpha: 0,
          duration: r ? 0 : 0.35,
          onComplete: () => (page.style.pointerEvents = 'none')
        });
        books.forEach((x) => x.setAttribute('aria-pressed', 'false'));
      };
    </script>
  </body>
</html>
