<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Projetos — Paper Agenda</title>
    <style>
      :root {
        --desk: #d7d2bf;
        --paper: #fffdf5;
        --ink: #20332f;
        --blue: #346d80;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--desk);
        color: var(--ink);
        font-family: Arial, sans-serif;
      }
      .agenda {
        min-height: 100vh;
        padding: clamp(1rem, 4vw, 4rem);
        display: grid;
        grid-template-columns: 0.65fr 1.35fr;
        gap: 2rem;
      }
      .cover {
        display: flex;
        min-height: 0;
        flex-direction: column;
        padding: 1.5rem;
        border: 1px solid #20332f55;
        background: var(--blue);
        color: var(--paper);
        box-shadow: 0.7rem 0.7rem 0 rgb(32 51 47/0.2);
      }
      .cover p {
        font:
          700 0.6rem/1.3 ui-monospace,
          monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .cover h1 {
        margin: auto 0;
        font:
          400 clamp(4rem, 9vw, 9rem)/0.7 Georgia,
          serif;
        letter-spacing: -0.1em;
      }
      .cover small {
        line-height: 1.5;
      }
      .days {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.7rem;
      }
      .day {
        display: flex;
        min-height: 60vh;
        flex-direction: column;
        padding: 1rem;
        border: 1px solid #20332f55;
        background: var(--paper);
        color: var(--ink);
        cursor: pointer;
        text-align: left;
      }
      .day[aria-selected='true'] {
        background: #f5dd78;
        transform: translateY(-0.7rem);
        box-shadow: 0.4rem 0.6rem 0 rgb(32 51 47/0.2);
      }
      .day span {
        font:
          700 0.58rem/1 ui-monospace,
          monospace;
        letter-spacing: 0.1em;
      }
      .day h2 {
        margin: auto 0;
        font:
          400 clamp(3rem, 6vw, 6rem)/0.7 Georgia,
          serif;
        letter-spacing: -0.1em;
        writing-mode: vertical-rl;
      }
      .note {
        grid-column: 1/-1;
        display: grid;
        grid-template-columns: 0.8fr 1.2fr;
        gap: 2rem;
        padding: 1.5rem;
        border-top: 2px solid var(--ink);
        background: var(--paper);
      }
      .note p {
        margin: 0;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      .note b {
        font:
          700 0.6rem/1.3 ui-monospace,
          monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      @media (max-width: 650px) {
        .agenda {
          grid-template-columns: 1fr;
        }
        .cover {
          min-height: 16rem;
        }
        .days {
          grid-template-columns: repeat(2, 1fr);
        }
        .day {
          min-height: 28vh;
        }
        .note {
          grid-template-columns: 1fr;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="agenda">
      <aside class="cover">
        <p>Agenda de produção</p>
        <h1>Quatro dias de interface.</h1>
        <small
          >Uma variante em que as abas se tornam dias de trabalho: cada coluna abre uma nota de
          projeto no rodapé.</small
        >
      </aside>
      <section class="days">
        <button
          class="day"
          aria-selected="true"
          data-name="Regula"
          data-copy="Regula — produto de regulação que organiza regras, decisões e próximos passos em uma mesma superfície."
        >
          <span>Seg / 01</span>
          <h2>Regula</h2>
          <span>Produto</span></button
        ><button
          class="day"
          aria-selected="false"
          data-name="eFood"
          data-copy="eFood — percurso de compra com ênfase na descoberta, no pedido e na continuidade da entrega."
        >
          <span>Ter / 02</span>
          <h2>eFood</h2>
          <span>Comércio</span></button
        ><button
          class="day"
          aria-selected="false"
          data-name="E‑Play"
          data-copy="E‑Play — catálogo de jogos que dá espaço para descoberta, marca e um ritmo de navegação próprio."
        >
          <span>Qua / 03</span>
          <h2>E‑Play</h2>
          <span>Cultura</span></button
        ><button
          class="day"
          aria-selected="false"
          data-name="To‑Do"
          data-copy="To‑Do — rotina de tarefas pensada para manter prioridades e estados em uma leitura leve."
        >
          <span>Qui / 04</span>
          <h2>To‑Do</h2>
          <span>Rotina</span>
        </button>
      </section>
      <footer class="note" aria-live="polite">
        <b>Seg / 01 · Regula</b>
        <p>
          Regula — produto de regulação que organiza regras, decisões e próximos passos em uma mesma
          superfície.
        </p>
      </footer>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      const days = [...document.querySelectorAll('.day')],
        note = document.querySelector('.note'),
        label = document.querySelector('.note b'),
        copy = document.querySelector('.note p'),
        r = matchMedia('(prefers-reduced-motion:reduce)').matches;
      gsap.from(['.cover', '.day', '.note'], {
        autoAlpha: 0,
        y: 24,
        stagger: 0.08,
        duration: r ? 0 : 0.7,
        ease: 'power3.out'
      });
      days.forEach(
        (d, i) =>
          (d.onclick = () => {
            days.forEach((x) => x.setAttribute('aria-selected', 'false'));
            d.setAttribute('aria-selected', 'true');
            gsap
              .timeline({ defaults: { duration: r ? 0 : 0.3, ease: 'power3.inOut' } })
              .to(note, { autoAlpha: 0, y: 8 })
              .call(() => {
                label.textContent = `${['Seg / 01', 'Ter / 02', 'Qua / 03', 'Qui / 04'][i]} · ${d.dataset.name}`;
                copy.textContent = d.dataset.copy;
              })
              .to(note, { autoAlpha: 1, y: 0 });
          })
      );
    </script>
  </body>
</html>
