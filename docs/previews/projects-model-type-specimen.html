<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projetos — Type Specimen</title>
    <style>
      :root {
        --paper: #fffdf8;
        --ink: #171717;
        --acid: #d5ff31;
        --faded: #b8b7b2;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }
      .specimen {
        position: relative;
        min-height: 100vh;
        padding: clamp(1.1rem, 3vw, 3rem);
        overflow: hidden;
      }
      .meta {
        position: relative;
        z-index: 3;
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding-bottom: clamp(3rem, 9vw, 8rem);
        font:
          700 0.66rem/1 ui-monospace,
          monospace;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }
      .meta b {
        color: #627800;
      }
      .intro {
        position: relative;
        z-index: 3;
        max-width: 48rem;
        margin-bottom: clamp(2rem, 6vw, 5rem);
      }
      h1 {
        margin: 0;
        font:
          400 clamp(3rem, 7vw, 8.5rem)/0.77 Georgia,
          serif;
        letter-spacing: -0.1em;
      }
      h1 strong {
        font-family: Arial, sans-serif;
        font-weight: 900;
      }
      .intro p {
        max-width: 29rem;
        margin: 1.2rem 0 0;
        font-size: 0.88rem;
        line-height: 1.5;
      }
      .wall {
        position: relative;
        z-index: 2;
      }
      .word {
        position: relative;
        display: grid;
        grid-template-columns: clamp(3rem, 12vw, 11rem) 1fr auto;
        gap: 1rem;
        align-items: baseline;
        width: 100%;
        padding: 0.3rem 0;
        border-top: 1px solid var(--ink);
        background: transparent;
        color: inherit;
        border-right: 0;
        border-bottom: 0;
        border-left: 0;
        cursor: pointer;
        text-align: left;
      }
      .word:last-child {
        border-bottom: 1px solid var(--ink);
      }
      .word__index,
      .word__kind {
        font:
          700 0.64rem/1 ui-monospace,
          monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .word__kind {
        color: #6c6a65;
      }
      .word__title {
        font:
          900 clamp(3.2rem, 10.5vw, 11rem)/0.74 Arial,
          sans-serif;
        letter-spacing: -0.115em;
        transition: color 0.2s;
      }
      .word:hover .word__title,
      .word:focus-visible .word__title,
      .word[aria-pressed='true'] .word__title {
        color: #6d8500;
      }
      .word:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 4px;
      }
      .reveal {
        position: fixed;
        z-index: 1;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(52vw, 48rem);
        background: var(--acid);
        clip-path: inset(0 0 0 100%);
        pointer-events: none;
      }
      .reveal img {
        position: absolute;
        inset: 11%;
        width: 78%;
        height: 57%;
        object-fit: cover;
        filter: grayscale(1) contrast(1.15);
        mix-blend-mode: multiply;
      }
      .reveal__caption {
        position: absolute;
        right: 10%;
        bottom: 11%;
        left: 11%;
        font:
          400 clamp(1.5rem, 3vw, 3rem)/0.93 Georgia,
          serif;
        letter-spacing: -0.06em;
      }
      .cursor-label {
        position: fixed;
        z-index: 4;
        padding: 0.55rem 0.7rem;
        background: var(--ink);
        color: var(--paper);
        font:
          700 0.57rem/1 ui-monospace,
          monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        pointer-events: none;
        transform: translate(-50%, -50%);
        opacity: 0;
      }
      @media (max-width: 700px) {
        .meta {
          padding-bottom: 4rem;
        }
        .word {
          grid-template-columns: 2.5rem 1fr;
        }
        .word__kind {
          display: none;
        }
        .reveal {
          width: 100%;
          height: 40vh;
          top: auto;
          clip-path: inset(100% 0 0);
        }
        .reveal img {
          inset: 12%;
          width: 76%;
          height: 54%;
        }
        .reveal__caption {
          bottom: 10%;
          font-size: 1.6rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="specimen">
      <header class="meta">
        <span>Typecase / projetos selecionados</span><b>passe ou escolha um nome</b
        ><span>2024—26</span>
      </header>
      <section class="intro">
        <h1>O nome é a <strong>interface.</strong></h1>
        <p>
          Uma coleção construída como uma prova tipográfica: cada projeto toma a página pelo seu
          próprio peso, e a prévia só aparece quando há curiosidade.
        </p>
      </section>
      <section class="wall" aria-label="Projetos em formato tipográfico">
        <button
          class="word"
          aria-pressed="false"
          data-copy="Clareza regulatória para decisões que precisam deixar rastro."
          data-image="../../public/mockups/regula/desktop-01.png"
        >
          <span class="word__index">01</span><span class="word__title">REGULA</span
          ><span class="word__kind">produto</span>
        </button>
        <button
          class="word"
          aria-pressed="false"
          data-copy="Pedido, descoberta e entrega articulados em uma única cadência."
          data-image="../../public/mockups/e-food/desktop-01.png"
        >
          <span class="word__index">02</span><span class="word__title">EFOOD</span
          ><span class="word__kind">comércio</span>
        </button>
        <button
          class="word"
          aria-pressed="false"
          data-copy="Um catálogo que assume o ritmo, cor e personalidade do jogo."
          data-image="../../public/mockups/e-play/desktop-01.png"
        >
          <span class="word__index">03</span><span class="word__title">E‑PLAY</span
          ><span class="word__kind">cultura</span>
        </button>
        <button
          class="word"
          aria-pressed="false"
          data-copy="Pequenas tarefas tratadas como uma coreografia cotidiana."
          data-image="../../public/mockups/to-do/desktop-01.png"
        >
          <span class="word__index">04</span><span class="word__title">TO‑DO</span
          ><span class="word__kind">utilitário</span>
        </button>
      </section>
      <aside class="reveal" aria-live="polite">
        <img src="" alt="" />
        <p class="reveal__caption"></p>
      </aside>
      <span class="cursor-label">ver projeto</span>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      const words = [...document.querySelectorAll('.word')],
        reveal = document.querySelector('.reveal'),
        preview = reveal.querySelector('img'),
        caption = reveal.querySelector('p'),
        cursor = document.querySelector('.cursor-label'),
        reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      gsap.from(['.meta', '.intro', '.word'], {
        autoAlpha: 0,
        y: 20,
        stagger: 0.08,
        duration: reduced ? 0 : 0.7,
        ease: 'power3.out'
      });
      function show(word) {
        words.forEach((item) => item.setAttribute('aria-pressed', 'false'));
        word.setAttribute('aria-pressed', 'true');
        preview.src = word.dataset.image;
        caption.textContent = word.dataset.copy;
        gsap.killTweensOf([reveal, preview, caption]);
        gsap
          .timeline({ defaults: { duration: reduced ? 0 : 0.35, ease: 'power3.out' } })
          .to(reveal, { clipPath: innerWidth > 700 ? 'inset(0 0 0 0)' : 'inset(0 0 0 0)' })
          .fromTo(preview, { scale: 1.08, autoAlpha: 0 }, { scale: 1, autoAlpha: 1 }, '<.08')
          .fromTo(caption, { y: 18, autoAlpha: 0 }, { y: 0, autoAlpha: 1 }, '<.1');
      }
      words.forEach((word) => {
        word.addEventListener('mouseenter', () => show(word));
        word.addEventListener('focus', () => show(word));
        word.addEventListener('click', () => show(word));
      });
      addEventListener('pointermove', (e) =>
        gsap.to(cursor, {
          x: e.clientX,
          y: e.clientY,
          autoAlpha: 1,
          duration: 0.18,
          overwrite: 'auto'
        })
      );
    </script>
  </body>
</html>
