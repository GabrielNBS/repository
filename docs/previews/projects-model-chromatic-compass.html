<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Projetos — Chromatic Compass</title>
    <style>
      :root {
        --ink: #172031;
        --paper: #fffdf7;
        --rule: #17203133;
        --accent: #ff6045;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }
      .compass {
        min-height: 100vh;
        padding: clamp(1rem, 3vw, 3rem);
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 1.4rem;
      }
      .mast {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 1rem;
        font:
          700 0.61rem/1 ui-monospace,
          monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .mast b {
        text-align: center;
        color: var(--accent);
      }
      .mast span:last-child {
        text-align: right;
      }
      .display {
        display: grid;
        grid-template-columns: minmax(12rem, 0.55fr) 1fr;
        gap: clamp(1rem, 3vw, 3rem);
        min-height: 0;
      }
      .intro {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        border-right: 1px solid var(--rule);
        padding-right: 1.4rem;
      }
      .intro h1 {
        max-width: 5ch;
        margin: 0;
        font:
          400 clamp(3.5rem, 7vw, 7.5rem)/0.73 Georgia,
          serif;
        letter-spacing: -0.1em;
      }
      .intro h1 strong {
        font:
          900 1em Arial,
          sans-serif;
      }
      .intro p {
        max-width: 20rem;
        margin: 2rem 0;
        font-size: 0.82rem;
        line-height: 1.5;
      }
      .compass-key {
        position: relative;
        width: 8rem;
        aspect-ratio: 1;
        margin-top: auto;
        border: 1px solid var(--ink);
        border-radius: 50%;
      }
      .compass-key::before,
      .compass-key::after {
        position: absolute;
        top: 50%;
        left: 50%;
        background: var(--ink);
        content: '';
        transform: translate(-50%, -50%);
      }
      .compass-key::before {
        width: 1px;
        height: 84%;
      }
      .compass-key::after {
        width: 84%;
        height: 1px;
      }
      .compass-key i {
        position: absolute;
        top: 8%;
        left: 50%;
        width: 0.6rem;
        height: 0.6rem;
        border-radius: 50%;
        background: var(--accent);
        transform: translateX(-50%);
      }
      .field {
        position: relative;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
      }
      .color {
        position: relative;
        display: flex;
        min-height: clamp(12rem, 34vh, 23rem);
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
        padding: 1.2rem;
        border: 0;
        background: var(--tone);
        color: var(--ink);
        cursor: pointer;
        text-align: left;
      }
      .color::after {
        position: absolute;
        right: -1.5rem;
        bottom: -2.5rem;
        color: rgb(23 32 49/0.12);
        content: attr(data-no);
        font: 900 12rem/0.7 Arial;
      }
      .color span,
      .color strong {
        position: relative;
        z-index: 1;
      }
      .color span {
        font:
          700 0.6rem/1 ui-monospace,
          monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .color strong {
        max-width: 5ch;
        font:
          900 clamp(2.5rem, 5vw, 5rem)/0.75 Arial,
          sans-serif;
        letter-spacing: -0.1em;
      }
      .color[aria-pressed='true'] {
        outline: 5px solid var(--ink);
        outline-offset: -5px;
      }
      .color:focus-visible {
        outline: 5px solid var(--accent);
        outline-offset: 3px;
      }
      .readout {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 1rem;
        padding-top: 1rem;
        border-top: 1px solid var(--rule);
      }
      .readout p {
        max-width: 46rem;
        margin: 0;
        font:
          400 clamp(1.2rem, 2vw, 2rem)/1.05 Georgia,
          serif;
        letter-spacing: -0.05em;
      }
      .readout__meta {
        color: #5e6470;
        font:
          700 0.6rem/1.35 ui-monospace,
          monospace;
        letter-spacing: 0.08em;
        text-align: right;
        text-transform: uppercase;
      }
      .readout__meta b {
        display: block;
        color: var(--ink);
        margin-bottom: 0.25rem;
      }
      @media (max-width: 680px) {
        .mast {
          grid-template-columns: 1fr auto;
        }
        .mast span:last-child {
          display: none;
        }
        .display {
          grid-template-columns: 1fr;
        }
        .intro {
          border: 0;
          padding: 0;
        }
        .intro p {
          margin: 1rem 0;
        }
        .compass-key {
          display: none;
        }
        .color {
          min-height: 13rem;
        }
        .readout {
          grid-template-columns: 1fr;
        }
        .readout__meta {
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <main class="compass">
      <header class="mast">
        <span>Arquivo cromático / 04 projetos</span><b>Seleção ativa</b
        ><span>Estúdio de interfaces</span>
      </header>
      <section class="display">
        <aside class="intro">
          <div>
            <h1>Uma <strong>cor</strong> para cada sistema.</h1>
            <p>
              A parede ganha bússola, escala e uma leitura curta do porquê de cada projeto existir.
            </p>
          </div>
          <div class="compass-key"><i></i></div>
        </aside>
        <div class="field" aria-label="Projetos">
          <button
            class="color"
            style="--tone: #bde2ff"
            data-no="01"
            aria-pressed="true"
            data-copy="Regulação transformada em uma superfície de decisão clara e acompanhável."
            data-meta="Produto / 2026"
          >
            <span>01 · Produto</span><strong>Regula</strong></button
          ><button
            class="color"
            style="--tone: #ffd0aa"
            data-no="02"
            aria-pressed="false"
            data-copy="Escolha, pedido e entrega em uma trilha de compra que não dispersa a atenção."
            data-meta="Comércio / 2025"
          >
            <span>02 · Comércio</span><strong>eFood</strong></button
          ><button
            class="color"
            style="--tone: #d6ec69"
            data-no="03"
            aria-pressed="false"
            data-copy="Um catálogo de jogos que trata cada entrada como o começo de uma sessão."
            data-meta="Cultura / 2025"
          >
            <span>03 · Cultura</span><strong>E‑Play</strong></button
          ><button
            class="color"
            style="--tone: #eccdf0"
            data-no="04"
            aria-pressed="false"
            data-copy="Uma rotina de tarefas que faz prioridade, filtro e conclusão parecerem naturais."
            data-meta="Utilitário / 2024"
          >
            <span>04 · Rotina</span><strong>To‑Do</strong>
          </button>
        </div>
      </section>
      <footer class="readout" aria-live="polite">
        <p>Regulação transformada em uma superfície de decisão clara e acompanhável.</p>
        <div class="readout__meta"><b>Regula</b><span>Produto / 2026</span></div>
      </footer>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      const cards = [...document.querySelectorAll('.color')],
        text = document.querySelector('.readout p'),
        meta = document.querySelector('.readout__meta'),
        reduced = matchMedia('(prefers-reduced-motion:reduce)').matches;
      gsap.from(['.mast', '.intro', '.color', '.readout'], {
        autoAlpha: 0,
        y: 20,
        stagger: 0.08,
        duration: reduced ? 0 : 0.7,
        ease: 'power3.out'
      });
      cards.forEach(
        (card) =>
          (card.onclick = () => {
            cards.forEach((x) => x.setAttribute('aria-pressed', 'false'));
            card.setAttribute('aria-pressed', 'true');
            gsap
              .timeline({ defaults: { duration: reduced ? 0 : 0.3, ease: 'power3.inOut' } })
              .to('.readout', { autoAlpha: 0, y: 8 })
              .call(() => {
                text.textContent = card.dataset.copy;
                meta.innerHTML = `<b>${card.querySelector('strong').textContent}</b><span>${card.dataset.meta}</span>`;
              })
              .to('.readout', { autoAlpha: 1, y: 0 });
          })
      );
    </script>
  </body>
</html>
