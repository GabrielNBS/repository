<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>04 — Pôster deslocado</title>
    <style>
      :root {
        --paper: #f6efe5;
        --ink: #25221f;
        --muted: #665e57;
        --peach: #efae82;
        --cream: #e7d6bb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        width: min(1200px, calc(100% - 40px));
        margin: 0 auto;
        padding: clamp(42px, 9vw, 120px) 0;
      }
      .intro {
        max-width: 620px;
        margin-bottom: clamp(40px, 8vw, 84px);
      }
      .eyebrow,
      .meta,
      figcaption {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
      }
      .eyebrow::before {
        content: '';
        width: 28px;
        height: 1px;
        background: currentColor;
      }
      h1 {
        margin: 16px 0 0;
        font-size: clamp(58px, 11vw, 138px);
        font-weight: 400;
        letter-spacing: -0.12em;
        line-height: 0.77;
      }
      .composition {
        display: grid;
        grid-template-columns: minmax(150px, 0.42fr) minmax(0, 1.58fr);
        gap: clamp(28px, 6vw, 84px);
        align-items: center;
      }
      .copy {
        align-self: stretch;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 22px 0;
        border-top: 1px solid var(--ink);
        border-bottom: 1px solid var(--ink);
      }
      .copy p {
        max-width: 18ch;
        margin: 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.42;
      }
      .copy strong {
        display: block;
        margin-top: 24px;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(38px, 5vw, 70px);
        font-weight: 400;
        letter-spacing: -0.1em;
        line-height: 0.8;
      }
      .copy .meta {
        color: var(--muted);
      }
      figure {
        position: relative;
        margin: 0;
        padding: 0 24px 24px 0;
      }
      figure::before {
        content: '';
        position: absolute;
        inset: 24px 0 0 24px;
        z-index: -1;
        background: var(--peach);
      }
      figure::after {
        content: '';
        position: absolute;
        inset: 0 24px 24px 0;
        z-index: -1;
        border: 1px solid var(--ink);
        transform: translate(12px, 12px);
      }
      .screen {
        position: relative;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border: 10px solid var(--ink);
        background: var(--ink);
        box-shadow: 0 28px 48px -28px rgb(37 34 31 / 70%);
      }
      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: saturate(0.9);
      }
      .screen::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgb(37 34 31 / 10%),
          transparent 40%,
          rgb(239 174 130 / 20%)
        );
        pointer-events: none;
      }
      figcaption {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-top: 14px;
        color: var(--muted);
      }
      @media (max-width: 720px) {
        main {
          width: min(100% - 28px, 1200px);
        }
        .composition {
          grid-template-columns: 1fr;
          gap: 36px;
        }
        .copy {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 20px;
        }
        .copy p {
          max-width: 28ch;
        }
        figure {
          padding-right: 14px;
          padding-bottom: 14px;
        }
        figure::before {
          inset: 14px 0 0 14px;
        }
        figure::after {
          inset: 0 14px 14px 0;
        }
        .screen {
          border-width: 6px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="intro">
        <div class="eyebrow">04 / Direção visual</div>
        <h1>Pôster deslocado</h1>
      </header>
      <section class="composition">
        <aside class="copy">
          <div>
            <strong>Regula</strong>
            <p>
              Uma camada de cor, sombra e deslocamento transforma o vídeo em um pôster de
              apresentação.
            </p>
          </div>
          <span class="meta">Dashboard e PDV / 2026</span>
        </aside>
        <figure>
          <div class="screen">
            <video
              autoplay
              muted
              loop
              playsinline
              poster="../../../public/videos/projects/regula-poster.webp"
            >
              <source src="../../../public/videos/projects/regula.webm" type="video/webm" />
              <source src="../../../public/videos/projects/regula.mp4" type="video/mp4" />
            </video>
          </div>
          <figcaption><span>Preview da interface</span><span>04 / 05</span></figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
