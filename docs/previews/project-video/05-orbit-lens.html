<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>05 — Lente orbital</title>
    <style>
      :root {
        --paper: #f6efe5;
        --ink: #25221f;
        --muted: #665e57;
        --peach: #efae82;
        --lilac: #cdb8d8;
        --rose: #e8b6aa;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        overflow-x: hidden;
        background: var(--cream, #e7d6bb);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        width: min(1160px, calc(100% - 40px));
        margin: 0 auto;
        padding: clamp(42px, 8vw, 110px) 0;
      }
      .intro {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 30px;
        margin-bottom: 40px;
      }
      .eyebrow,
      .meta,
      figcaption {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }
      .eyebrow {
        color: var(--muted);
      }
      h1 {
        margin: 14px 0 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(52px, 10vw, 124px);
        font-weight: 400;
        letter-spacing: -0.12em;
        line-height: 0.78;
      }
      .intro p {
        max-width: 260px;
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.4;
      }
      .stage {
        position: relative;
        display: grid;
        place-items: center;
        min-height: clamp(360px, 58vw, 690px);
        isolation: isolate;
      }
      .stage::before,
      .stage::after {
        content: '';
        position: absolute;
        border: 1px solid rgb(37 34 31 / 16%);
        border-radius: 50%;
        transform: rotate(-12deg);
      }
      .stage::before {
        width: 78%;
        aspect-ratio: 1;
        background:
          radial-gradient(circle at 36% 32%, rgb(239 174 130 / 80%), transparent 20%),
          radial-gradient(circle, rgb(205 184 216 / 80%), transparent 66%);
        box-shadow: 0 35px 80px -46px rgb(37 34 31 / 70%);
      }
      .stage::after {
        width: 92%;
        aspect-ratio: 1;
        border-color: rgb(37 34 31 / 11%);
        transform: rotate(22deg);
      }
      .screen {
        position: relative;
        z-index: 1;
        width: min(76%, 840px);
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border: 12px solid var(--paper);
        border-radius: 42% 58% 52% 48% / 44% 42% 58% 56%;
        background: var(--ink);
        box-shadow:
          0 28px 0 rgb(37 34 31 / 10%),
          0 42px 80px -40px rgb(37 34 31 / 75%);
        transform: rotate(-4deg);
      }
      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: saturate(0.86) contrast(1.04);
      }
      .screen::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgb(239 174 130 / 22%),
          transparent 42%,
          rgb(37 34 31 / 15%)
        );
        pointer-events: none;
      }
      .orbit-label {
        position: absolute;
        right: 2%;
        bottom: 12%;
        z-index: 2;
        max-width: 220px;
        padding: 16px 18px;
        border: 1px solid rgb(37 34 31 / 18%);
        border-radius: 12px;
        background: rgb(246 239 229 / 88%);
        box-shadow: 0 20px 40px -25px rgb(37 34 31 / 80%);
        transform: rotate(5deg);
      }
      .orbit-label strong {
        display: block;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 26px;
        font-weight: 400;
        letter-spacing: -0.07em;
      }
      .orbit-label span {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      figcaption {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        margin-top: 10px;
        color: var(--muted);
      }
      @media (max-width: 680px) {
        main {
          width: min(100% - 28px, 1160px);
        }
        .intro {
          display: block;
        }
        .intro p {
          margin-top: 24px;
        }
        .stage {
          min-height: 340px;
        }
        .stage::before {
          width: 110%;
        }
        .stage::after {
          width: 125%;
        }
        .screen {
          width: 92%;
          border-width: 7px;
        }
        .orbit-label {
          right: -2%;
          bottom: 4%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="intro">
        <div>
          <div class="eyebrow">05 / Direção visual</div>
          <h1>Lente orbital</h1>
        </div>
        <p>
          Uma abordagem mais autoral: o vídeo vira o centro de uma composição com anéis, recorte
          orgânico e legenda flutuante.
        </p>
      </header>
      <figure>
        <div class="stage">
          <div class="screen">
            <video
              autoplay
              muted
              loop
              playsinline
              poster="../../../public/videos/projects/regula-poster.webp"
            >
              <source src="../../../public/videos/projects/regula.webm" type="video/webm" />
              <source src="../../../public/videos/projects/regula.mp4" type="video/mp4" />
            </video>
          </div>
          <div class="orbit-label"><span>Em foco / 05</span><strong>Regula responde.</strong></div>
        </div>
        <figcaption>
          <span>Gestão operacional para comércio</span><span>Preview lens</span>
        </figcaption>
      </figure>
    </main>
  </body>
</html>
