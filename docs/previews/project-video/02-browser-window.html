<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>02 — Janela de produto</title>
    <style>
      :root {
        --paper: #f6efe5;
        --ink: #25221f;
        --muted: #665e57;
        --peach: #efae82;
        --lilac: #cdb8d8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: linear-gradient(135deg, var(--paper) 0 55%, var(--lilac) 55% 100%);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        width: min(1160px, calc(100% - 40px));
        margin: 0 auto;
        padding: clamp(40px, 9vw, 120px) 0;
      }
      .intro {
        display: grid;
        grid-template-columns: 1fr minmax(180px, 280px);
        align-items: end;
        gap: 32px;
        margin-bottom: 36px;
      }
      .eyebrow,
      .browser-bar,
      .caption {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .eyebrow {
        color: var(--muted);
      }
      h1 {
        margin: 12px 0 0;
        font-size: clamp(48px, 9vw, 112px);
        font-weight: 400;
        letter-spacing: -0.11em;
        line-height: 0.8;
      }
      .intro p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.4;
      }
      .browser {
        position: relative;
        padding: 10px;
        border: 1px solid rgb(37 34 31 / 18%);
        border-radius: 24px;
        background: rgb(246 239 229 / 75%);
        box-shadow:
          22px 28px 0 rgb(37 34 31 / 10%),
          0 40px 90px -45px rgb(37 34 31 / 85%);
        backdrop-filter: blur(12px);
      }
      .browser-top {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 16px;
        min-height: 42px;
        padding: 0 12px;
      }
      .dots {
        display: flex;
        gap: 6px;
      }
      .dots i {
        display: block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--ink);
        opacity: 0.5;
      }
      .dots i:nth-child(2) {
        background: var(--peach);
        opacity: 1;
      }
      .address {
        overflow: hidden;
        border: 1px solid rgb(37 34 31 / 14%);
        border-radius: 999px;
        padding: 7px 12px;
        color: var(--muted);
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .browser-top .browser-bar:last-child {
        color: var(--muted);
      }
      .viewport {
        position: relative;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border-radius: 16px;
        background: var(--ink);
      }
      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: saturate(0.82) contrast(1.02);
      }
      .viewport::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 1;
        background:
          linear-gradient(180deg, transparent 48%, rgb(37 34 31 / 42%)),
          linear-gradient(100deg, rgb(239 174 130 / 14%), transparent 40%);
        pointer-events: none;
      }
      .project-tag {
        position: absolute;
        right: clamp(18px, 4vw, 52px);
        bottom: clamp(18px, 4vw, 52px);
        z-index: 2;
        max-width: 260px;
        padding: 18px 20px;
        border: 1px solid rgb(246 239 229 / 25%);
        border-radius: 14px;
        background: rgb(37 34 31 / 86%);
        color: var(--paper);
        box-shadow: 0 20px 30px rgb(37 34 31 / 24%);
      }
      .project-tag small {
        display: block;
        margin-bottom: 8px;
        color: var(--peach);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .project-tag strong {
        display: block;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(22px, 3vw, 34px);
        font-weight: 400;
        letter-spacing: -0.06em;
      }
      .caption {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-top: 18px;
        color: var(--muted);
      }
      @media (max-width: 680px) {
        main {
          width: min(100% - 28px, 1160px);
        }
        .intro {
          display: block;
        }
        .intro p {
          margin-top: 24px;
        }
        .browser {
          border-radius: 18px;
        }
        .browser-top {
          grid-template-columns: auto 1fr;
        }
        .browser-top .browser-bar:last-child {
          display: none;
        }
        .project-tag {
          right: 14px;
          bottom: 14px;
          padding: 12px 14px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="intro">
        <div>
          <div class="eyebrow">02 / Direção visual</div>
          <h1>Janela de produto</h1>
        </div>
        <p>
          O vídeo aparece como uma interface sendo observada: barra de navegação, moldura e etiqueta
          sobreposta criam contexto.
        </p>
      </header>
      <figure class="browser">
        <div class="browser-top">
          <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span
          ><span class="address">gabrielnascimento.dev / projetos / regula</span
          ><span class="browser-bar">Live preview</span>
        </div>
        <div class="viewport">
          <video
            autoplay
            muted
            loop
            playsinline
            poster="../../../public/videos/projects/regula-poster.webp"
          >
            <source src="../../../public/videos/projects/regula.webm" type="video/webm" />
            <source src="../../../public/videos/projects/regula.mp4" type="video/mp4" />
          </video>
          <div class="project-tag"><small>Dashboard e PDV</small><strong>Regula</strong></div>
        </div>
        <figcaption class="caption">
          <span>Uma visão em movimento</span><span>02 / 05</span>
        </figcaption>
      </figure>
    </main>
  </body>
</html>
