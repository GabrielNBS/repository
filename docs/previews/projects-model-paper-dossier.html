<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Projetos — Paper Dossier</title>
    <style>
      :root {
        --ground: #9b9587;
        --paper: #f8f1de;
        --ink: #20251b;
        --mark: #c94132;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--ground);
        color: var(--ink);
        font-family: Arial, sans-serif;
      }
      .dossier {
        min-height: 100vh;
        padding: clamp(1rem, 5vw, 5rem);
        display: grid;
        place-items: center;
      }
      .case {
        position: relative;
        width: min(100%, 72rem);
        min-height: 44rem;
        padding: clamp(1.3rem, 4vw, 3.5rem);
        background: var(--paper);
        box-shadow: 1.4rem 1.4rem 0 rgb(32 37 27/0.25);
      }
      .case::before,
      .case::after {
        position: absolute;
        z-index: -1;
        width: 92%;
        height: 92%;
        background: #e8ddc7;
        content: '';
      }
      .case::before {
        top: -0.8rem;
        left: 1.2rem;
        transform: rotate(-1.2deg);
      }
      .case::after {
        right: -0.8rem;
        bottom: -0.8rem;
        background: #ded5c2;
        transform: rotate(1.1deg);
      }
      .case__head {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        border-bottom: 2px solid var(--ink);
        padding-bottom: 1rem;
        font:
          700 0.6rem/1 ui-monospace,
          monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .case__head b {
        color: var(--mark);
      }
      .content {
        display: grid;
        grid-template-columns: 0.55fr 1.45fr;
        gap: clamp(1rem, 4vw, 4rem);
        padding-top: clamp(2rem, 5vw, 5rem);
      }
      .labels {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
      }
      .label {
        align-self: flex-start;
        border: 0;
        border-left: 3px solid var(--ink);
        background: transparent;
        padding: 0.45rem 0.6rem;
        color: var(--ink);
        font:
          700 0.6rem/1 ui-monospace,
          monospace;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        cursor: pointer;
      }
      .label[aria-selected='true'] {
        border-color: var(--mark);
        background: var(--mark);
        color: var(--paper);
        transform: translateX(0.5rem);
      }
      .sheet {
        min-height: 27rem;
        padding: clamp(1.2rem, 3vw, 2.5rem);
        border: 1px solid #20251b55;
        background: #fffaf0;
      }
      .sheet p {
        max-width: 34rem;
        font-size: 0.9rem;
        line-height: 1.55;
      }
      .sheet__eyebrow {
        margin: 0;
        color: var(--mark);
        font:
          700 0.6rem/1 ui-monospace,
          monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .sheet h1 {
        max-width: 6ch;
        margin: 1rem 0;
        font:
          400 clamp(4rem, 8vw, 8rem)/0.7 Georgia,
          serif;
        letter-spacing: -0.1em;
      }
      .stamp {
        display: inline-block;
        margin-top: 1rem;
        border: 2px solid var(--mark);
        padding: 0.55rem;
        color: var(--mark);
        font:
          700 0.58rem/1 ui-monospace,
          monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        transform: rotate(-4deg);
      }
      .ledger {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        margin-top: 3rem;
        padding-top: 1rem;
        border-top: 1px solid #20251b44;
      }
      .ledger span {
        display: block;
        color: #687060;
        font:
          700 0.55rem/1 ui-monospace,
          monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .ledger b {
        display: block;
        margin-top: 0.4rem;
        font-size: 0.75rem;
      }
      @media (max-width: 650px) {
        .content {
          grid-template-columns: 1fr;
        }
        .labels {
          flex-direction: row;
          flex-wrap: wrap;
        }
        .ledger {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="dossier">
      <section class="case">
        <header class="case__head">
          <span>Dossiê de interfaces</span><b>Confidencial / estudo</b><span>2024—26</span>
        </header>
        <div class="content">
          <nav class="labels">
            <button
              class="label"
              aria-selected="true"
              data-name="Regula"
              data-type="Dossiê 01 / produto"
              data-copy="Uma camada de controle que torna regras, decisões e estados fáceis de localizar."
              data-role="Produto"
              data-year="2026"
            >
              Regula</button
            ><button
              class="label"
              aria-selected="false"
              data-name="eFood"
              data-type="Dossiê 02 / comércio"
              data-copy="Descoberta e pedido se encontram em uma experiência focada na continuidade."
              data-role="Interface"
              data-year="2025"
            >
              eFood</button
            ><button
              class="label"
              aria-selected="false"
              data-name="E‑Play"
              data-type="Dossiê 03 / cultura"
              data-copy="Um catálogo onde a identidade visual acompanha o desejo de explorar jogos."
              data-role="Direção"
              data-year="2025"
            >
              E‑Play</button
            ><button
              class="label"
              aria-selected="false"
              data-name="To‑Do"
              data-type="Dossiê 04 / rotina"
              data-copy="Tarefas diárias dispostas em uma sequência que reduz a fricção do cotidiano."
              data-role="Interações"
              data-year="2024"
            >
              To‑Do
            </button>
          </nav>
          <article class="sheet">
            <p class="sheet__eyebrow">Dossiê 01 / produto</p>
            <h1>Regula</h1>
            <p class="sheet__copy">
              Uma camada de controle que torna regras, decisões e estados fáceis de localizar.
            </p>
            <b class="stamp">Revisado</b>
            <div class="ledger">
              <div><span>Atuação</span><b>Produto</b></div>
              <div><span>Ano</span><b>2026</b></div>
              <div><span>Arquivo</span><b>01 / 04</b></div>
            </div>
          </article>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      const l = [...document.querySelectorAll('.label')],
        s = document.querySelector('.sheet'),
        e = document.querySelector('.sheet__eyebrow'),
        h = document.querySelector('.sheet h1'),
        p = document.querySelector('.sheet__copy'),
        b = [...document.querySelectorAll('.ledger b')],
        r = matchMedia('(prefers-reduced-motion:reduce)').matches;
      gsap.from(['.case__head', '.labels', '.sheet'], {
        autoAlpha: 0,
        y: 25,
        stagger: 0.1,
        duration: r ? 0 : 0.7,
        ease: 'power3.out'
      });
      l.forEach(
        (x, i) =>
          (x.onclick = () => {
            l.forEach((a) => a.setAttribute('aria-selected', 'false'));
            x.setAttribute('aria-selected', 'true');
            gsap
              .timeline({ defaults: { duration: r ? 0 : 0.3, ease: 'power3.inOut' } })
              .to(s, { autoAlpha: 0, x: 15 })
              .call(() => {
                e.textContent = x.dataset.type;
                h.textContent = x.dataset.name;
                p.textContent = x.dataset.copy;
                b[0].textContent = x.dataset.role;
                b[1].textContent = x.dataset.year;
                b[2].textContent = `0${i + 1} / 04`;
              })
              .to(s, { autoAlpha: 1, x: 0 });
          })
      );
    </script>
  </body>
</html>
